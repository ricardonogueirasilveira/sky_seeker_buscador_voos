<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://lucide.dev/icons/plane.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#002060" />
    <meta name="description" content="Sky Seeker - Encontre as melhores passagens aéreas com IA" />
    <link rel="manifest" href="/manifest.json" />
    <title>SKY SEEKER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Custom Palette based on Portal CGGT image
              brand: {
                blue: {
                  50: '#e6ebf5',
                  100: '#cddaeec',
                  200: '#9bb5dc',
                  300: '#6990cd',
                  400: '#376bbe',
                  500: '#0546af', 
                  600: '#00388c', 
                  700: '#002b6b', 
                  800: '#002060', // Primary Deep Blue (Sidebar/Header)
                  900: '#001540',
                },
                yellow: {
                  400: '#ffe033',
                  500: '#FFD700', // Primary Action Yellow (Button/Dashboards)
                  600: '#e6c200',
                }
              },
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            animation: {
              'fly-in': 'flyIn 1s ease-out forwards',
              'fade-in': 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              flyIn: {
                '0%': { transform: 'translateX(-100px) translateY(100px) scale(0.5)', opacity: '0' },
                '100%': { transform: 'translateX(0) translateY(0) scale(1)', opacity: '1' },
              },
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            }
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* Custom Scrollbar */
      ::-webkit-scrollbar { width: 8px; }
      ::-webkit-scrollbar-track { background: #f1f1f1; }
      ::-webkit-scrollbar-thumb { background: #002060; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #00388c; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
  <body class="bg-slate-100 text-slate-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
